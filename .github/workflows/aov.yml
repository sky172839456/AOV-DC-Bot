name: AOV Discord Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: aov-discord-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  aov-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python bot.py

      - name: Commit latest.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- latest.txt; then
            echo "latest.txt 沒有變更"
          else
            git pull --rebase --autostash
            git add latest.txt
            git commit -m "Update latest news id"
            git push
          fi
