name: AOV Discord Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: aov-discord-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  aov-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_WEBHOOK_URL: ${{ secrets.TEST_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --test-categories
          else
            python bot.py
          fi

      - name: Commit latest.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- latest.txt sent_ids.txt)" ]; then
            echo "通知紀錄沒有變更"
            exit 0
          fi

          latest_id="$(cat latest.txt)"
          sent_ids="$(cat sent_ids.txt 2>/dev/null || true)"
          echo "latest.txt will be updated to: ${latest_id}"

          git fetch origin main
          git reset --hard origin/main
          printf "%s" "${latest_id}" > latest.txt
          printf "%s" "${sent_ids}" > sent_ids.txt

          if [ -z "$(git status --porcelain -- latest.txt sent_ids.txt)" ]; then
            echo "遠端通知紀錄已經是最新"
            exit 0
          fi

          git add latest.txt sent_ids.txt
          git commit -m "Update sent news records"
          git push origin HEAD:main
